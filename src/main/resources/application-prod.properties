# ===============================
# SERVER
# ===============================
# Railway asigna un puerto dinámicamente usando la variable PORT.
server.port=${PORT:8080}

# ===============================
# DATASOURCE (Inyectado por Railway)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# Mantenemos 'validate' para que Flyway haga el trabajo duro de forma segura
spring.jpa.hibernate.ddl-auto=validate
# En producción se recomienda apagar los logs de SQL por rendimiento y seguridad
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# LOGGING
# ===============================
# Reducimos el nivel de logs para no saturar la consola de Railway
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ===============================
# AWS CREDENTIALS (Inyectado por Railway)
# ===============================
aws.access.key=${AWS_ACCESS_KEY_ID}
aws.secret.key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket.name=${AWS_BUCKET_NAME}
aws.s3.bucket.profiles=${AWS_BUCKET_PROFILES}
